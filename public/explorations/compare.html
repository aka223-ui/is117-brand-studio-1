<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ita-Tees — compare directions</title>
    <link rel="icon" href="data:," />

  <body>
    <header>
      <h1>One brand. Two directions.</h1>
      <p>
        Same white tee, artwork, headline, supporting copy, and action. Compare
        composition and typography.
      </p>
      <p>
        <a href="modern.html">Open A / Modernist</a> ·
        <a href="postmodern.html">Open B / Postmodernist</a>
      </p>
    </header>
    <main>
      <section>
        <h2>A / Modernist · desktop</h2>
        <div class="desktop">
          <iframe
            src="modern.html"
            title="Modernist desktop preview"
            width="1180"
            height="780"
          ></iframe>
        </div>
        <h2>B / Postmodernist · desktop</h2>
        <div class="desktop">
          <iframe
            src="postmodern.html"
            title="Postmodernist desktop preview"
            width="1180"
            height="780"
          ></iframe>
        </div>
      </section>
      <section>
        <h2>Phone comparison · 375 pixels each</h2>
        <div class="phones">
          <div>
            <h3>A / Modernist</h3>
            <iframe
              src="modern.html"
              title="Modernist phone preview"
              width="375"
              height="1200"
            ></iframe>
          </div>
          <div>
            <h3>B / Postmodernist</h3>
            <iframe
              src="postmodern.html"
              title="Postmodernist phone preview"
              width="375"
              height="1200"
            ></iframe>
          </div>
        </div>
      </section>
